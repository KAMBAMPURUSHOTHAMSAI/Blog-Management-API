<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Complete Your Profile</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            color: #1f2937;
        }

        .card {
            width: min(
                460px,
                100%
            );

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 20px;

            padding: 34px;

            box-shadow:
                0 20px 50px
                rgba(
                    15,
                    23,
                    42,
                    0.10
                );
        }

        .icon {
            width: 52px;
            height: 52px;

            border-radius: 14px;

            background: #eef2ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 26px;

            margin-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;

            margin-bottom: 24px;
        }

        label {
            display: block;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            border:
                1px solid #d1d5db;

            border-radius: 10px;

            font-size: 14px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.12
                );
        }

        button {
            width: 100%;

            margin-top: 16px;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.93;
        }

        .note {
            margin-top: 15px;

            font-size: 12px;

            color: #6b7280;

            line-height: 1.5;
        }

    </style>

</head>


<body>

<div class="card">

    <div class="icon">
        ✉️
    </div>

    <h1>
        Complete Your Profile
    </h1>

    <p class="description">
        Facebook authentication was successful,
        but Facebook did not provide an email address.
        Enter your email address to complete your
        Blog Management account.
    </p>

    <form
        method="POST"
        action="/auth/complete-profile"
    >

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required
            autocomplete="email"
        >

        <button type="submit">
            Continue to Dashboard
        </button>

    </form>

    <p class="note">
        Your email is used to create your local
        Blog Management account.
    </p>

</div>

</body>

</html>
